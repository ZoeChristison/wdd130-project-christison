<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Prep Hub</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <img class="logo" src="images/logo.png" alt="logo">
        <nav>
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="checklist.html">Checklist</a>
            <a class="nav-link" href="mission-contact.html">Contact</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Florida Tampa Mission</h1>
    </section>

    <main>
        <!-- MISSION MAP CARD -->
        <div class="card">
            <h2>Mission Map</h2>
            <img class="mission-map" src="images/florida.png" alt="Florida mission map">
        </div>

        <!-- TIMELINE CARD -->
        <div class="card">
            <h2>Timeline</h2>
            <p>April 29, 2026 – Home MTC</p>
            <p>May 6, 2026 – Provo MTC</p>
            <p>May 20, 2026 – Arrive in Florida</p>
        </div>

        <!-- COUNTDOWN CARD -->
        <div class="card">
            <h2>Countdown</h2>
            <p>Days until departure: <span id="countdown"></span></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Zoe Christison</p>
    </footer>

    <!-- COUNTDOWN SCRIPT -->
    <script>
        // Set the mission start date
        const missionDate = new Date("April 29, 2026 00:00:00").getTime();

        // Update countdown every second
        const countdownElement = document.getElementById("countdown");
        const timer = setInterval(() => {
            const now = new Date().getTime();
            const distance = missionDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));

            countdownElement.textContent = days >= 0 ? days + " days" : "Mission started!";
        }, 1000);
    </script>
</body>
</html>
